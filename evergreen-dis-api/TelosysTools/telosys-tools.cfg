# -------------------------------------------
# Telosys project configuration
# -------------------------------------------
# --- Project folders (standard variables)
SRC=src/main/java
RES=src/main/resources
WEB=src/main/webapp
TEST_SRC=src/test/java
TEST_RES=src/test/resources
#SRC=src
#RES=res
#WEB=WebContent
#TEST_SRC=src
#TEST_RES=
DOC=doc
TMP=tmp
# --- Project Packages (standard variables)
ROOT_PKG=co.evergreen.dis
ENTITY_PKG=co.evergreen.dis.persistence.entities

# -------------------------------------------
# --- Project Variables
ProjectVariable.MAVEN_ARTIFACT_ID=evergreen-dis-api
ProjectVariable.MAVEN_GROUP_ID=co.evergreen
ProjectVariable.PROJECT_NAME=evergreen-dis-api
ProjectVariable.PROJECT_VERSION=1.0.0
# REST backend configuration
# Puerto 8000 : es el que espera por defecto el bundle front-angular
# (ver src/environments/environment.development.ts -> apiRootUrl)
ProjectVariable.REST_SERVER_PORT=8000
ProjectVariable.REST_API_ROOT=/api/v1
ProjectVariable.REST_URL_ROOT=http://localhost:8000
# Database configuration (PostgreSQL en Podman, ver docker-compose.yml)
ProjectVariable.DB_HOST=localhost
ProjectVariable.DB_PORT=5432
ProjectVariable.DB_NAME=evergreen_dis
ProjectVariable.DB_SCHEMA=public
ProjectVariable.DB_JDBC_URL=jdbc:postgresql://localhost:5432/evergreen_dis
ProjectVariable.DB_USER=evergreen
ProjectVariable.DB_PASSWORD=evergreen
ProjectVariable.DB_JDBC_DRIVER_CLASS=org.postgresql.Driver
ProjectVariable.DB_JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------
# --- Specific Folders (use absolute path)
#-- Specific destination for code generation :
# SpecificDestinationFolder=C:/dir1/dir2
# SpecificDestinationFolder=/dir1/dir2
#-- Specific location for templates :
# SpecificTemplatesFolder=C:/dir1/dir2
# SpecificTemplatesFolder=/dir1/dir2
#-- Specific location for models (since ver 4.2.0) :
#-- El modelo NO se duplica: se apunta al unico modelo del repositorio,
#-- que sigue siendo la fuente de verdad (evergreen-dis-modelo/TelosysTools/models)
#-- Ruta RELATIVA al directorio desde el que se lanza el CLI de Telosys.
#-- Convencion del proyecto: lanzar siempre el CLI desde la raiz del repositorio.
#-- Se usa relativa (y no absoluta) para que el repo funcione en cualquier equipo.
SpecificModelsFolder=evergreen-dis-modelo/TelosysTools/models

# -------------------------------------------
# --- Specific Depots in GitHub for bundles and models (since ver 4.2.0) :
# SpecificDepotForBundles=github_user:user-name
# SpecificDepotForBundles=github_org:my-organization
# SpecificDepotForBundles=github_org:my-organization(https://myhost)
# SpecificDepotForModels=github_user:foobar
# SpecificDepotForModels=github_org:my-orga 

# -------------------------------------------
# --- Network proxy configuration
# http.proxyHost=my.proxy.hostname
# http.proxyPort=8080
# http.nonProxyHosts=localhost|127.0.0.1
# http.proxyUser=foo
# http.proxyPassword=secret
#--
